# Based on the Cargo-normalized Sayiir 1.0.0 archive manifest.
# Glirulus renames the package and its local sibling edges; upstream archive
# identities and fork attribution are recorded in NOTICE.
#
# ORIGINAL CARGO NORMALIZATION NOTICE:
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# The exact upstream archive contains its original Cargo.toml.orig.

[package]
edition = "2024"
name = "glirulus-core"
version = "1.0.0-glirulus.1"
authors = ["Yacine Bouraoui <ybsoft2011@live.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Core types and traits for the Glirulus durable workflow engine"
homepage = "https://github.com/superions/glirulus"
documentation = "https://docs.rs/glirulus-core"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "NOTICE"]
keywords = [
    "workflow",
    "orchestration",
    "durable",
    "async",
    "distributed",
]
categories = [
    "asynchronous",
    "concurrency",
]
license = "MIT"
repository = "https://github.com/superions/glirulus"
resolver = "2"

[features]
default = ["tokio"]
rkyv = [
    "dep:rkyv",
    "dep:bytecheck",
]
tokio = ["dep:tokio"]

[lib]
name = "glirulus_core"
path = "src/lib.rs"

[dependencies.bytecheck]
version = "0.8"
optional = true

[dependencies.bytes]
version = "1"
features = ["serde"]

[dependencies.chrono]
version = "0.4"
features = [
    "std",
    "serde",
    "clock",
]
default-features = false

[dependencies.hex]
version = "0.4"

[dependencies.rkyv]
version = "0.8"
features = [
    "std",
    "bytecheck",
    "bytes-1",
]
optional = true

[dependencies.rustc-hash]
version = "2"

[dependencies.serde]
version = "1"
features = [
    "derive",
    "rc",
]

[dependencies.sha2]
version = "0.10"

[dependencies.strum]
version = "0.28"
features = ["derive"]

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = ["rt"]
optional = true

[dev-dependencies.proptest]
version = "1"

[dev-dependencies.serde_json]
version = "1"
