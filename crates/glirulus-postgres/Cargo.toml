# Standalone Glirulus manifest, derived from the Sayiir 1.0.0 archive.
# Source provenance and generic modifications are recorded in NOTICE.

[package]
edition = "2024"
name = "glirulus-postgres"
version = "1.0.0-glirulus.1"
authors = ["Yacine Bouraoui <ybsoft2011@live.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "PostgreSQL persistence backend for the Glirulus workflow engine"
homepage = "https://github.com/superions/glirulus"
documentation = "https://docs.rs/glirulus-postgres"
readme = "README.md"
include = ["src/**", "tests/**", "README.md", "LICENSE", "NOTICE", "migrations/**"]
keywords = [
    "workflow",
    "orchestration",
    "durable",
    "async",
    "distributed",
]
categories = [
    "asynchronous",
    "concurrency",
]
license = "MIT"
repository = "https://github.com/superions/glirulus"
resolver = "2"

[lib]
name = "glirulus_postgres"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies.backon]
version = "1"

[dependencies.bytes]
version = "1"
features = ["serde"]

[dependencies.chrono]
version = "0.4"
features = [
    "std",
    "serde",
    "clock",
]
default-features = false

[dependencies.flume]
version = "0.12"

[dependencies.glirulus-core]
version = "=1.0.0-glirulus.1"
path = "../glirulus-core"
default-features = false

[dependencies.glirulus-persistence]
version = "=1.0.0-glirulus.1"
path = "../glirulus-persistence"

[dependencies.sha2]
version = "0.10"

[dependencies.sqlx]
version = "0.8"
features = [
    "runtime-tokio",
    "postgres",
    "chrono",
]

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = [
    "rt",
    "rt",
    "time",
]

[dependencies.tokio-util]
version = "0.7"
default-features = false

[dependencies.tracing]
version = "0.1"

# Development dependencies restored from upstream commit
# 7e6318225398ad7a418efb866156d2cc327ee43f; absent in the published manifest.
[dev-dependencies.tokio]
version = "1"
features = ["rt", "rt-multi-thread", "macros"]

[dev-dependencies.glirulus-core]
version = "=1.0.0-glirulus.1"
path = "../glirulus-core"
default-features = false

[dev-dependencies.glirulus-runtime]
version = "=1.0.0-glirulus.1"
path = "../glirulus-runtime"
default-features = false
features = ["rkyv", "json", "macros"]

[dev-dependencies.serde_json]
version = "1"

[dev-dependencies.bytes]
version = "1"
features = ["serde"]

[dev-dependencies.testcontainers]
version = "0.27"

[dev-dependencies.testcontainers-modules]
version = "0.15"
features = ["postgres"]
