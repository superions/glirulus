# Based on the Cargo-normalized Sayiir 1.0.0 archive manifest.
# Glirulus renames the package and its local sibling edges; upstream archive
# identities and fork attribution are recorded in NOTICE.
#
# ORIGINAL CARGO NORMALIZATION NOTICE:
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# The exact upstream archive contains its original Cargo.toml.orig.

[package]
edition = "2024"
name = "glirulus-macros"
version = "1.0.0"
authors = ["Yacine Bouraoui <ybsoft2011@live.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Procedural macros for the Glirulus durable workflow engine"
homepage = "https://github.com/superions/glirulus"
documentation = "https://docs.rs/glirulus-macros"
readme = "README.md"
include = ["src/**", "README.md", "LICENSE", "NOTICE"]
keywords = [
    "workflow",
    "orchestration",
    "durable",
    "async",
    "distributed",
]
categories = [
    "development-tools::procedural-macro-helpers",
    "asynchronous",
    "concurrency",
]
license = "MIT"
repository = "https://github.com/superions/glirulus"
resolver = "2"

[lib]
name = "glirulus_macros"
path = "src/lib.rs"
proc-macro = true

[dependencies.darling]
version = "0.23"

[dependencies.proc-macro2]
version = "1.0"

[dependencies.quote]
version = "1.0"

[dependencies.syn]
version = "2.0"
features = ["full"]

[dev-dependencies.trybuild]
version = "1"
